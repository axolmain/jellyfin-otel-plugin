framework: "net9.0"
overview: "OpenTelemetry log exporter for Jellyfin"
description: >
  Forwards Jellyfin's Serilog log events to an OpenTelemetry-compatible
  collector via OTLP/HTTP, alongside the host's normal console and file
  logging. Supports hot-reloading endpoint configuration and optional
  backfill of pre-init boot logs.
category: "General"
owner: "axolmain"
artifacts:
- "Jellyfin.Plugin.Jellytel.dll"
changelog: |
  - Bundle System.Diagnostics.DiagnosticSource.dll. The OpenTelemetry SDK
    1.15.3 binaries reference DiagnosticSource 10.0.0, which net9-bundled
    Jellyfin server distributions don't ship; 1.0.1.1 hit a
    FileNotFoundException on plugin load as a result.