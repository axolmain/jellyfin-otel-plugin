framework: "net9.0"
overview: "OpenTelemetry log exporter for Jellyfin"
description: >
  Forwards Jellyfin's Serilog log events to an OpenTelemetry-compatible
  collector via OTLP/HTTP, alongside the host's normal console and file
  logging. Supports hot-reloading endpoint configuration and optional
  backfill of pre-init boot logs.
category: "General"
owner: "axolmain"
artifacts:
- "Jellyfin.Plugin.Jellytel.dll"
changelog: >
  - Add OpenTelemetry metrics pipeline alongside the existing logs export,
    with a per-panel toggle architecture and a first SessionMetrics panel
    mirroring the Jellyfin dashboard's active sessions, playback start/stop,
    duration, and transcode reason surface.
  - Add user-configurable minimum log level for OTLP export so operators can
    decide what severity gets shipped to their collector.
  - Refactor logs code into Logs/ namespace and extract BootLogReplayer for
    clearer separation between the logs and metrics pipelines.