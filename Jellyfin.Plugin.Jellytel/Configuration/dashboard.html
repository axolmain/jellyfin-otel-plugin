<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Jellytel Dashboard</title>
</head>
<body>
<div id="JellytelDashboardPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button">
    <style>
        /* Scoped to the dashboard page. Inlined here (not in <head>) because
           Jellyfin's web client extracts just the data-role="page" element when
           it injects a plugin page into the dashboard DOM — anything in <head>
           gets discarded. */
        #JellytelDashboardPage .jt-container { padding: 1.5em; }
        #JellytelDashboardPage h1.jt-title { margin: 0 0 1em 0; }
        #JellytelDashboardPage .jt-status {
            background: rgba(255,255,255,0.04);
            border-left: 3px solid #00a4dc;
            padding: 0.8em 1em;
            margin-bottom: 1.5em;
            font-family: monospace;
            font-size: 0.9em;
            border-radius: 0 4px 4px 0;
        }
        #JellytelDashboardPage .jt-status.warn { border-left-color: #e8a23a; }
        #JellytelDashboardPage .jt-status.err  { border-left-color: #d44141; }

        #JellytelDashboardPage .jt-range {
            display: flex;
            gap: 0.5em;
            margin-bottom: 1.5em;
            flex-wrap: wrap;
        }
        #JellytelDashboardPage .jt-range button {
            background: rgba(255,255,255,0.06);
            color: inherit;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 0.4em 0.9em;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: inherit;
        }
        #JellytelDashboardPage .jt-range button.active {
            background: #00a4dc;
            border-color: #00a4dc;
            color: #fff;
        }

        #JellytelDashboardPage .jt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1em;
        }
        #JellytelDashboardPage .jt-card {
            background: rgba(255,255,255,0.04);
            border-radius: 6px;
            padding: 1em 1.2em;
            display: flex;
            flex-direction: column;
        }
        #JellytelDashboardPage .jt-card h3 {
            margin: 0 0 0.4em 0;
            font-size: 0.95em;
            font-weight: 500;
            opacity: 0.85;
        }
        #JellytelDashboardPage .jt-card .jt-value {
            font-size: 1.8em;
            font-weight: 300;
            margin-bottom: 0.3em;
            line-height: 1.1;
        }
        #JellytelDashboardPage .jt-card canvas.jt-chart {
            width: 100%;
            height: 60px;
            display: block;
            margin-top: 0.5em;
        }
        #JellytelDashboardPage .jt-empty {
            opacity: 0.5;
            font-style: italic;
            font-size: 0.85em;
            padding: 1.5em 0;
            text-align: center;
        }
    </style>

    <div data-role="content">
        <div class="content-primary jt-container">
            <h1 class="jt-title">Jellytel</h1>
            <div id="jt-export-status" class="jt-status">Loading export status…</div>

            <div class="jt-range">
                <button type="button" data-hours="1">1h</button>
                <button type="button" data-hours="6">6h</button>
                <button type="button" data-hours="24" class="active">24h</button>
                <button type="button" data-hours="168">7d</button>
            </div>

            <div id="jt-grid" class="jt-grid"></div>
        </div>
    </div>

    <script type="text/javascript">
    (function () {
        var METRICS = [
            { name: 'jellyfin.sessions.active',    label: 'Active sessions',    format: function (v) { return Math.round(v); } },
            { name: 'jellyfin.playback.started',   label: 'Playback starts',    format: function (v) { return Math.round(v); } },
            { name: 'jellyfin.playback.stopped',   label: 'Playback stops',     format: function (v) { return Math.round(v); } },
            { name: 'jellyfin.playback.duration',  label: 'Playback duration',  format: function (v) { return (v / 60).toFixed(1) + ' min'; } },
            { name: 'jellyfin.transcode.reasons',  label: 'Transcode reasons',  format: function (v) { return Math.round(v); } }
        ];

        var rangeHours = 24;
        var refreshTimer = null;

        function api(path) {
            return ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl(path), dataType: 'json' });
        }

        function bucketForRange(hours) {
            if (hours <= 1)   return 60000;        //  1 min
            if (hours <= 6)   return 300000;       //  5 min
            if (hours <= 24)  return 600000;       // 10 min
            return 3600000;                         //  1 hour
        }

        function renderExportStatus(s) {
            var el = document.getElementById('jt-export-status');
            if (!s) {
                el.className = 'jt-status warn';
                el.textContent = 'Export status unavailable.';
                return;
            }
            if (!s.OtlpConfigured) {
                el.className = 'jt-status warn';
                el.textContent = 'OTLP export disabled — metrics are buffered locally only. Configure the OTLP endpoint to start exporting.';
                return;
            }
            var bits = ['OTLP export enabled.'];
            if (s.LastExportSuccessMs) {
                bits.push('Last success: ' + new Date(s.LastExportSuccessMs).toLocaleString() + '.');
            }
            if (s.LastError) {
                bits.push('Last error: ' + s.LastError);
                el.className = 'jt-status err';
            } else {
                el.className = 'jt-status';
            }
            el.textContent = bits.join(' ');
        }

        function buildCard(m) {
            var card = document.createElement('div');
            card.className = 'jt-card';
            card.setAttribute('data-metric', m.name);
            card.innerHTML =
                '<h3>' + m.label + '</h3>' +
                '<div class="jt-value" data-value>—</div>' +
                '<canvas class="jt-chart" data-chart width="320" height="60"></canvas>';
            return card;
        }

        function drawSparkline(canvas, points) {
            var ctx = canvas.getContext('2d');
            // Crisp on retina
            var dpr = window.devicePixelRatio || 1;
            var cssW = canvas.clientWidth || 320;
            var cssH = canvas.clientHeight || 60;
            if (canvas.width !== Math.round(cssW * dpr)) {
                canvas.width = Math.round(cssW * dpr);
                canvas.height = Math.round(cssH * dpr);
            }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);

            if (!points || points.length === 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.font = '12px system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('No data in range', cssW / 2, cssH / 2 + 4);
                return;
            }

            var minX = points[0].TimestampMs, maxX = points[points.length - 1].TimestampMs;
            var minY = points[0].Value, maxY = points[0].Value;
            for (var i = 0; i < points.length; i++) {
                if (points[i].Value < minY) minY = points[i].Value;
                if (points[i].Value > maxY) maxY = points[i].Value;
            }
            if (minY === maxY) { minY -= 0.5; maxY += 0.5; }
            var xRange = maxX - minX || 1;
            var yRange = maxY - minY;
            var pad = 4;
            var w = cssW - 2 * pad, h = cssH - 2 * pad;

            // Fill
            ctx.beginPath();
            for (var j = 0; j < points.length; j++) {
                var x = pad + ((points[j].TimestampMs - minX) / xRange) * w;
                var y = pad + (1 - (points[j].Value - minY) / yRange) * h;
                if (j === 0) { ctx.moveTo(x, cssH - pad); ctx.lineTo(x, y); }
                else { ctx.lineTo(x, y); }
            }
            ctx.lineTo(pad + w, cssH - pad);
            ctx.closePath();
            ctx.fillStyle = 'rgba(0,164,220,0.15)';
            ctx.fill();

            // Stroke
            ctx.beginPath();
            for (var k = 0; k < points.length; k++) {
                var x2 = pad + ((points[k].TimestampMs - minX) / xRange) * w;
                var y2 = pad + (1 - (points[k].Value - minY) / yRange) * h;
                if (k === 0) ctx.moveTo(x2, y2);
                else ctx.lineTo(x2, y2);
            }
            ctx.strokeStyle = '#00a4dc';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function loadSnapshot() {
            return api('Jellytel/Snapshot').then(function (snap) {
                var grid = document.getElementById('jt-grid');
                if (!snap.BufferEnabled) {
                    grid.innerHTML = '<div class="jt-card"><div class="jt-empty">Local buffer is disabled — enable it in the Jellytel plugin settings.</div></div>';
                    return false;
                }
                if (grid.children.length === 0 || grid.firstElementChild.classList.contains('jt-empty')) {
                    grid.innerHTML = '';
                    METRICS.forEach(function (m) { grid.appendChild(buildCard(m)); });
                }
                var byName = {};
                (snap.Metrics || []).forEach(function (m) { byName[m.Metric] = m; });
                METRICS.forEach(function (m) {
                    var card = grid.querySelector('[data-metric="' + m.name + '"]');
                    if (!card) return;
                    var s = byName[m.name];
                    card.querySelector('[data-value]').textContent = s ? m.format(s.Value) : '—';
                });
                return true;
            }).catch(function (err) {
                document.getElementById('jt-grid').innerHTML =
                    '<div class="jt-card"><div class="jt-empty">Could not load snapshot. (' +
                    (err && (err.statusText || err.message) || 'unknown error') + ')</div></div>';
                return false;
            });
        }

        function loadSeries(m) {
            var now = Date.now();
            var from = now - rangeHours * 3600000;
            var bucket = bucketForRange(rangeHours);
            var url = 'Jellytel/Series?metric=' + encodeURIComponent(m.name) +
                      '&fromMs=' + from + '&toMs=' + now + '&bucketMs=' + bucket;
            return api(url).catch(function () { return { Points: [] }; }).then(function (series) {
                var card = document.querySelector('[data-metric="' + m.name + '"]');
                if (!card) return;
                var canvas = card.querySelector('[data-chart]');
                if (!canvas) return;
                drawSparkline(canvas, series.Points || []);
            });
        }

        function refresh() {
            loadSnapshot().then(function (ok) {
                if (!ok) return;
                METRICS.forEach(loadSeries);
            });
            api('Jellytel/ExportStatus').then(renderExportStatus).catch(function () {
                renderExportStatus(null);
            });
        }

        function bindRangeButtons() {
            var buttons = document.querySelectorAll('#JellytelDashboardPage .jt-range button');
            buttons.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    buttons.forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    rangeHours = parseInt(btn.getAttribute('data-hours'), 10);
                    refresh();
                });
            });
        }

        var page = document.querySelector('#JellytelDashboardPage');
        page.addEventListener('pageshow', function () {
            bindRangeButtons();
            refresh();
            refreshTimer = setInterval(refresh, 30000);
        });
        page.addEventListener('pagehide', function () {
            if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        });
    })();
    </script>
</div>
</body>
</html>
